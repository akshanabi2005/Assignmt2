<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tamil Nadu Police Department - Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            color: #17365d;
            font-size: 24px;
            margin: 5px 0 8px;
        }

        h2 {
            color: #555;
            font-size: 17px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .demo {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .field {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #17365d;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d2745;
        }

        #message {
            margin-top: 15px;
            color: #17365d;
            font-weight: bold;
            font-size: 14px;
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #777;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img src="tn-police-logo.jpg"
         alt="Tamil Nadu Police Logo"
         class="logo">

    <h1>Tamil Nadu Police Department</h1>

    <h2>Department Login</h2>

    <div class="demo">
        DEMO PAGE — NOT AN OFFICIAL WEBSITE
    </div>

    <form onsubmit="demoLogin(event)">

        <div class="field">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="off"
                required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="off"
                required>
        </div>

        <button type="submit">
            Demo Login
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        This is a demonstration interface only.<br>
        Do not enter real usernames or passwords.
    </div>

</div>

<script>
function demoLogin(event) {
    event.preventDefault();

    document.getElementById("message").innerHTML =
        "✓ Demo login — no credentials were transmitted or stored.";

    document.getElementById("password").value = "";
}
</script>

</body>
</html>
